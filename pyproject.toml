[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdebrief"
version = "0.1.0"
description = "Fine-tune an LLM (LoRA/QLoRA) to turn flight-log digests into grounded, structured debriefs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "flightlake @ git+https://github.com//flightlake.git",
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "pydantic>=2", "typer>=0.12", "pyyaml>=6",
  "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.46", "peft>=0.13", "trl>=0.12", "datasets>=3.0", "accelerate>=1.0",
         "bitsandbytes>=0.44; platform_system=='Linux'"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flightdebrief = "flightdebrief.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
markers = ["slow: runs a tiny offline TRL/PEFT fine-tune"]
